<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hive · your personal trip agent on a Fly.io Sprite</title>
  <meta name="description" content="Hive researches real places, plans every meal, sight and stay, checks the plan against the forecast and fixes it, then lets you refine it by chat." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="top">
    <a class="brand" href="/" data-nav="/"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 3 57 17.5v29L32 61 7 46.5v-29z" fill="#f5a524"/><path d="M32 15 46.7 23.5v17L32 49 17.3 40.5v-17z" fill="#1f1a17"/><circle cx="32" cy="32" r="6" fill="#f5a524"/></svg>Hive</a>
    <nav>
      <a href="/" data-nav="/">New trip</a>
      <a href="/#trips" data-nav="/#trips">My trips</a>
      <a href="/#profile" data-nav="/#profile">Profile</a>
    </nav>
    <div id="health" class="health"></div>
  </header>

  <main id="app"></main>

  <footer class="foot">
    <span>Hive runs on a <b>Fly.io Sprite</b>. The model is reached through the <b>Sprites OpenRouter connector</b>, so no API key lives on this machine.</span>
    <span>Places © OpenStreetMap contributors via Photon · Weather by Open-Meteo · FX by Frankfurter · <a href="https://github.com/veerefines/hive-sprite" target="_blank" rel="noopener">Source</a></span>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/app.js"></script>
</body>
</html>
