# fly.toml app configuration file generated for triphive-sprite on 2026-11-25T05:05:48Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'triphive-sprite'
primary_region = 'ams'

[build]
[env]
  PORT = '8080'
  HIVE_DATA_DIR = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    method = 'GET'
    path = '/api/health'
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'

[[mounts]]
  source = 'hive_data'
  destination = '/data'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
